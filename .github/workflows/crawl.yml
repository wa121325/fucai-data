name: 每日抓取福彩开奖数据

on:
  schedule:
    # 每天北京时间 22:00 运行 (UTC 14:00)，开奖一般21:30前结束
    - cron: '0 14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行爬虫
        run: python lottery_crawler.py
        continue-on-error: true   # 即使部分失败，也继续推送已有数据

      - name: 提交并推送结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "自动更新开奖数据 $(date +'%Y-%m-%d')"
          git push
