name: 每日抓取 + ML预测

on:
  schedule:
    - cron: '30 13 * * *'   # UTC 13:30 = 北京时间 21:30
  workflow_dispatch:

jobs:
  crawl-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4
          pip install numpy scikit-learn xgboost lightgbm

      - name: 第一步：抓取最新开奖数据
        run: python lottery_crawler.py
        continue-on-error: true

      - name: 第二步：ML特征工程 + 训练 + 预测
        run: python lottery_ml.py
        continue-on-error: true

      - name: 提交并推送所有结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json history.json prediction.json
          git diff --cached --quiet || git commit -m "每日更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') | RF+XGB+LGB+马尔可夫+遗漏"
          git push
