name: 触发 Kaggle 运行

on:
  schedule:
    - cron: '30 13 * * *'   # UTC 13:30 = 北京时间 21:30
  workflow_dispatch:

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Kaggle CLI
        run: pip install kaggle

      - name: 配置 Kaggle Token
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: 推送脚本到 Kaggle 并触发运行
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          kaggle kernels push -p ./kaggle_kernel/
          echo "✓ 已推送，Kaggle 开始运行"

      - name: 等待运行完成（最多 40 分钟）
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          KERNEL="megskfdbbskeb/fucai-ml-daily"
          echo "监控 $KERNEL …"
          for i in $(seq 1 40); do
            sleep 60
            STATUS=$(kaggle kernels status $KERNEL 2>&1)
            echo "$(date +'%H:%M:%S') [$i/40] $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then
              echo "✓ Kaggle 运行完成"
              exit 0
            fi
            if echo "$STATUS" | grep -qi "error\|cancel\|failed"; then
              echo "✗ Kaggle 运行失败"
              exit 1
            fi
          done
          echo "⚠️ 超时 40 分钟"
          exit 0
