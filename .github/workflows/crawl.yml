name: 每日抓取开奖数据

on:
  schedule:
    - cron: '30 13 * * *'    # UTC 13:30 = 北京时间 21:30
  workflow_dispatch:
    inputs:
      full_crawl:
        description: '首次全量抓取历史数据？(yes/no)'
        required: false
        default: 'no'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 抓取开奖数据
        run: |
          if [ "${{ github.event.inputs.full_crawl }}" = "yes" ]; then
            echo ">>> 全量历史数据抓取"
            python lottery_crawler.py --full
          else
            echo ">>> 日常增量抓取"
            python lottery_crawler.py
          fi
        continue-on-error: true

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json history.json
          git diff --cached --quiet || git commit -m "每日开奖数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push
