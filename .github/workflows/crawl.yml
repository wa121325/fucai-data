name: 每日抓取福彩开奖数据

on:
  schedule:
    - cron: '30 13 * * *'   # UTC 13:30 = 北京时间 21:30
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行爬虫
        run: python lottery_crawler.py
        continue-on-error: true

      - name: 提交并推送结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json history.json
          git diff --cached --quiet || git commit -m "自动更新开奖数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push
