name: 每日 PPO 强化学习微调

on:
  workflow_run:
    workflows: ["每日 LSTM+Transformer 训练（增量微调）"]   # 必须和 lstm_daily.yml 的 name 完全一致
    types: [completed]
  schedule:
    - cron: '0 16 * * *'    # 兜底：万一上游没触发，0点左右强制兜底跑一次
  workflow_dispatch:

jobs:
  trigger-rl:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install kaggle
      - name: 配置 Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: 推送并触发
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: kaggle kernels push -p ./kaggle_rl_kernel/
      - name: 等待 Kaggle 初始化 Kernel
        run: sleep 90
      - name: 等待完成（最多30分钟，增量微调很快）
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          KERNEL="megskfdbbskeb/fucai-rl-daily"
          for i in $(seq 1 30); do
            STATUS=$(kaggle kernels status $KERNEL 2>&1 | tail -1)
            echo "$(date +'%H:%M:%S') [$i/30] $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then echo "✓完成"; exit 0; fi
            if echo "$STATUS" | grep -qi "error\|cancel\|failed"; then echo "✗失败"; exit 1; fi
            if echo "$STATUS" | grep -qi "404\|not found"; then echo "  Kernel还在初始化中，继续等待…"; fi
            sleep 60
          done
          echo "⚠️超时"; exit 0
