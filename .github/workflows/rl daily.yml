# ══ 自动触发开关：改 ci/switch.env 里的 NIGHTLY_ENABLED ══
#   true  → 每晚 21:30 由 nightly.yml 串行跑 ML→DL→RL；本文件的定时/自动接力让路
#   false → 恢复原来的方式（本文件照旧自动运行）；nightly.yml 的定时不再运行
# 手动点 "Run workflow"（workflow_dispatch）永远可用，不受开关影响。

name: 每日 PPO 强化学习微调

on:
  workflow_run:
    workflows: ["触发 Kaggle 运行"]   # 必须和 crawl.yml 的 name 完全一致
    types: [completed]
  workflow_dispatch:
  # 注意：不再设置 cron 兜底。
  # 之前加的兜底 cron 是"无脑触发"，不会检查当天是否已经通过 workflow_run 跑过，
  # 结果导致 RL 一天内被触发两次。如果 workflow_run 因为某种极端情况没有触发，
  # 手动点 workflow_dispatch 补跑一次即可。

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.g.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          NIGHTLY_ENABLED=true
          [ -f ci/switch.env ] && source ci/switch.env
          echo "nightly=$NIGHTLY_ENABLED" >> "$GITHUB_OUTPUT"

  trigger-rl:
    needs: gate
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event.workflow_run.event != 'schedule' || needs.gate.outputs.nightly != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install kaggle
      - name: 配置 Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: 推送并触发
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          echo "START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          kaggle kernels push -p ./kaggle_rl_kernel/
      - name: 等待 Kaggle 初始化 Kernel
        run: sleep 90
      # 等待上限放宽到 60 分钟：kaggle_rl_daily.py 自己启动时还会再核对一次
      # "prediction.json 的期数 == history.json 的期数"，不一致最多等 30 分钟（双保险）。
      - name: 等待完成（最多60分钟）
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          KERNEL="megskfdbbskeb/fucai-rl-daily"
          for i in $(seq 1 60); do
            STATUS=$(kaggle kernels status $KERNEL 2>&1 | tail -1)
            echo "$(date +'%H:%M:%S') [$i/60] $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then echo "✓完成"; exit 0; fi
            if echo "$STATUS" | grep -qiE "error|cancel|fail"; then echo "✗失败"; exit 1; fi
            if echo "$STATUS" | grep -qiE "404|not found"; then echo "  Kernel还在初始化中，继续等待…"; fi
            sleep 60
          done
          echo "⚠️超时"; exit 1
