name: 每日 PPO 强化学习微调

on:
  workflow_run:
    workflows: ["触发 Kaggle 运行"]   # 必须和 crawl.yml 的 name 完全一致
    types: [completed]
  workflow_dispatch:
  # 注意：不再设置 cron 兜底。
  # 之前加的兜底 cron 是"无脑触发"，不会检查当天是否已经通过 workflow_run 跑过，
  # 结果导致 RL 一天内被触发两次（workflow_run一次 + cron一次），
  # 每次都在昨天权重基础上继续学2万步，等于当天学习量翻倍，即"过度学习"。
  # 如果 workflow_run 因为某种极端情况没有触发，手动点 workflow_dispatch 补跑一次即可，
  # 比放一个可能导致重复执行的定时兜底更可控。

jobs:
  trigger-rl:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install kaggle
      - name: 配置 Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: 推送并触发
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: kaggle kernels push -p ./kaggle_rl_kernel/
      - name: 等待 Kaggle 初始化 Kernel
        run: sleep 90
      - name: 等待完成（最多30分钟）
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          KERNEL="megskfdbbskeb/fucai-rl-daily"
          for i in $(seq 1 30); do
            STATUS=$(kaggle kernels status $KERNEL 2>&1 | tail -1)
            echo "$(date +'%H:%M:%S') [$i/30] $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then echo "✓完成"; exit 0; fi
            if echo "$STATUS" | grep -qi "error\|cancel\|failed"; then echo "✗失败"; exit 1; fi
            if echo "$STATUS" | grep -qi "404\|not found"; then echo "  Kernel还在初始化中，继续等待…"; fi
            sleep 60
          done
          echo "⚠️超时"; exit 0
